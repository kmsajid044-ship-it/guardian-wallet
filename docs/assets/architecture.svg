<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Guardian Wallet architecture: owner console, agent service with checks in code, contract and ledger on a four-node FISCO BCOS network, audit log" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="620" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#0f172a">
    <text x="30" y="40" font-size="19" font-weight="700">Three layers stop a bad payment</text>
    <text x="30" y="62" font-size="13" fill="#475569">Code checks, contract rules, and the owner. Security never depends on the AI behaving.</text>

    <!-- top row -->
    <rect x="30" y="86" width="270" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="165" y="114" font-size="15" font-weight="700" text-anchor="middle">Owner console</text>
    <text x="165" y="134" font-size="12" text-anchor="middle" fill="#475569">Approve, decline, pause, resume</text>

    <rect x="365" y="86" width="270" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="500" y="114" font-size="15" font-weight="700" text-anchor="middle">LLM</text>
    <text x="500" y="134" font-size="12" text-anchor="middle" fill="#475569">Proposes; offline rules as fallback</text>

    <rect x="700" y="86" width="270" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="835" y="114" font-size="15" font-weight="700" text-anchor="middle">Risk Intel service</text>
    <text x="835" y="134" font-size="12" text-anchor="middle" fill="#475569">Payee checks, cached FX snapshot</text>

    <!-- layer 1 -->
    <rect x="30" y="186" width="940" height="170" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="48" y="212" font-size="14" font-weight="700" fill="#075985">LAYER 1 · Agent service: checks in code</text>
    <g font-size="13" text-anchor="middle">
      <rect x="48" y="232" width="128" height="52" rx="8" fill="#ffffff" stroke="#0284c7"/><text x="112" y="263">Firewall</text>
      <rect x="196" y="232" width="128" height="52" rx="8" fill="#ffffff" stroke="#0284c7"/><text x="260" y="263">Policy check</text>
      <rect x="344" y="232" width="128" height="52" rx="8" fill="#ffffff" stroke="#0284c7"/><text x="408" y="263">Simulation</text>
      <rect x="492" y="232" width="128" height="52" rx="8" fill="#ffffff" stroke="#0284c7"/><text x="556" y="263">Risk score</text>
      <rect x="640" y="232" width="128" height="52" rx="8" fill="#ffffff" stroke="#0284c7"/><text x="704" y="263">Tier gate</text>
      <rect x="788" y="232" width="164" height="52" rx="8" fill="#ffffff" stroke="#0284c7"/><text x="870" y="263">Restricted signer</text>
    </g>
    <text x="48" y="318" font-size="12" fill="#075985">Grounding check on every proposal · contact IDs, never raw addresses · planner and scheduler · hash-chained audit log</text>
    <text x="48" y="338" font-size="12" fill="#075985">The agent key can call only four contract functions: pay, requestApproval, saveToSavings, payServiceFee.</text>

    <!-- layer 2 -->
    <rect x="30" y="392" width="940" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="48" y="418" font-size="14" font-weight="700" fill="#5b21b6">LAYER 2 · Four-node FISCO BCOS network: rules in the contract</text>
    <rect x="48" y="436" width="430" height="84" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="263" y="466" font-size="15" font-weight="700" text-anchor="middle">GuardianWallet</text>
    <text x="263" y="488" font-size="12" text-anchor="middle" fill="#475569">Limits, recipient allowlist and cooldown,</text>
    <text x="263" y="506" font-size="12" text-anchor="middle" fill="#475569">approval queue, pause, only the owner resumes</text>
    <rect x="510" y="436" width="430" height="84" rx="10" fill="#ffffff" stroke="#7c3aed"/>
    <text x="725" y="466" font-size="15" font-weight="700" text-anchor="middle">DemoLedger</text>
    <text x="725" y="488" font-size="12" text-anchor="middle" fill="#475569">Simulated demo units by currency code,</text>
    <text x="725" y="506" font-size="12" text-anchor="middle" fill="#475569">no real money, owner-only currency list</text>

    <!-- layer 3 label -->
    <text x="30" y="578" font-size="13" font-weight="700" fill="#92400e">LAYER 3 · The owner decides</text>
    <text x="30" y="598" font-size="12" fill="#475569">Payments of 200 USD or more wait for the owner. The owner or guardian can pause at any time; only the owner can resume or change policy.</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M165 150V186" marker-end="url(#ar)"/>
    <path d="M500 150V186" marker-end="url(#ar)"/>
    <path d="M835 186V150" marker-end="url(#ar)"/>
    <path d="M176 258H196" marker-end="url(#ar)"/>
    <path d="M324 258H344" marker-end="url(#ar)"/>
    <path d="M472 258H492" marker-end="url(#ar)"/>
    <path d="M620 258H640" marker-end="url(#ar)"/>
    <path d="M768 258H788" marker-end="url(#ar)"/>
    <path d="M870 284V372H263V436" marker-end="url(#ar)"/>
    <path d="M478 478H510" marker-end="url(#ar)"/>
  </g>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#475569">
    <text x="172" y="172">owner request</text>
    <text x="508" y="172">proposal</text>
    <text x="843" y="172">fee-paid check</text>
    <text x="566" y="366">signed transaction</text>
  </g>
</svg>
