  <text x="64" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" fill="#e0e7ff">A trust and control layer for autonomous AI finance</text>
  <text x="64" y="256" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#bfdbfe">The LLM proposes. Code verifies. The contract enforces. The human decides above the line.</text>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#e0e7ff">
