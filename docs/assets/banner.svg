    <text x="884" y="96" font-size="12" letter-spacing="2" fill="#7dd3fc">LAYER 1</text>
    <text x="884" y="118" font-size="17" fill="#ffffff">Checks in code</text>
    <rect x="860" y="150" width="360" height="62" rx="12" fill="#ffffff" fill-opacity="0.10" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="884" y="176" font-size="12" letter-spacing="2" fill="#a5b4fc">LAYER 2</text>
    <text x="884" y="198" font-size="17" fill="#ffffff">Rules in the contract</text>
    <rect x="860" y="230" width="360" height="62" rx="12" fill="#ffffff" fill-opacity="0.10" stroke="#fde68a" stroke-width="1.5"/>
    <text x="884" y="256" font-size="12" letter-spacing="2" fill="#fde68a">LAYER 3</text>
    <text x="884" y="278" font-size="17" fill="#ffffff">The owner decides</text>
