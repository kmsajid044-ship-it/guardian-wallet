    <path d="M160 0V340M320 0V340M480 0V340M640 0V340M800 0V340M960 0V340M1120 0V340"/>
  </g>
  <text x="64" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="3" fill="#93c5fd">FINTECHATHON 2026 · INTERNATIONAL TRACK · TOPIC F</text>
  <text x="64" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="700" fill="#ffffff">Guardian Wallet</text>
