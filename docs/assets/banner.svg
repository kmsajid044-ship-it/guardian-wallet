    <rect x="272" y="284" width="250" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
    <text x="397" y="304" text-anchor="middle">Simulated demo units, no real money</text>
    <rect x="534" y="284" width="214" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
    <text x="641" y="304" text-anchor="middle">Four-node FISCO BCOS</text>
